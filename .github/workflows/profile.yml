name: Live profile

# Every 3 hours: redraw the hero with the repos I've pushed to most recently,
# and the stats panel and contribution grid from my contribution calendar.
# All of it goes to the `output` branch, so main never gets automated commits.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools uharfbuzz pillow

      # Switzer can't be committed (see DESIGN.md), so fetch the fonts on each run.
      - name: Fetch fonts
        run: python scripts/fetch_fonts.py

      - name: Build hero with live "now building"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/header.py --live --out dist

      - name: Build live stats panel and contribution grid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py --out dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
