name: Live profile

# Every 3 hours: redraw the hero with the repos I've pushed to most recently,
# and redraw the contribution snake. Both go to the `output` branch, so main
# never gets automated commits.

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools uharfbuzz pillow

      # Switzer can't be committed (see DESIGN.md), so fetch the fonts on each run.
      - name: Fetch fonts
        run: python scripts/fetch_fonts.py

      - name: Build hero with live "now building"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/header.py --live --out dist

      # Colors follow DESIGN.md: graphite-to-bone for dark, grey-to-ink for light.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F4F0E6&color_dots=#161B22,#2A2D31,#4C535B,#8A95A1,#D5DCE3
            dist/snake-light.svg?color_snake=#111111&color_dots=#EBEDF0,#CDD2D8,#9AA3AD,#5E6873,#1F262E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
