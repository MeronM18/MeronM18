name: Live profile

# Every 5 minutes: redraw the hero ("now building") and the stats panel, whose
# "commits today" counts every branch of every repo since midnight Eastern.
# Every 3 hours (and on push): also redraw the contribution snake.
# Everything goes to the `output` branch, so main never gets automated commits.
#
# Private repos only count if the PROFILE_TOKEN secret holds a read-only token
# that can see them (see DESIGN.md); without it, public repos still work.

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Start from what's published, so a quick run keeps the last snake.
      - name: Start from the published output
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output; then git archive FETCH_HEAD | tar -x -C dist; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: pip install fonttools uharfbuzz pillow

      # Switzer can't be committed (see DESIGN.md); fetch it once and cache it.
      - name: Cache fonts
        id: fonts
        uses: actions/cache@v4
        with:
          path: |
            scripts/fonts/body.ttf
            scripts/fonts/bodybold.ttf
          key: fonts-${{ hashFiles('scripts/fetch_fonts.py') }}

      - name: Fetch fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        run: python scripts/fetch_fonts.py

      - name: Build hero with live "now building"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/header.py --live --out dist

      - name: Build live stats panel
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats.py --out dist

      # Colors follow DESIGN.md: graphite-to-bone for dark, grey-to-ink for light.
      - uses: Platane/snk@v3
        if: github.event_name != 'schedule' || github.event.schedule == '17 */3 * * *'
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F4F0E6&color_dots=#161B22,#2A2D31,#4C535B,#8A95A1,#D5DCE3
            dist/snake-light.svg?color_snake=#111111&color_dots=#EBEDF0,#CDD2D8,#9AA3AD,#5E6873,#1F262E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
