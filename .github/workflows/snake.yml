name: Contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Colors follow DESIGN.md: graphite-to-bone for dark, grey-to-ink for light.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F4F0E6&color_dots=#161B22,#2A2D31,#4C535B,#8A95A1,#D5DCE3
            dist/snake-light.svg?color_snake=#111111&color_dots=#EBEDF0,#CDD2D8,#9AA3AD,#5E6873,#1F262E

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
